# 저장소에 올라간 파일을 그대로 GitHub Pages 로 배포한다.
#
# Settings → Pages 의 Source 가 "GitHub Actions" 로 되어 있으면 이 워크플로가
# 배포를 맡는다. 아직 Pages 가 꺼져 있으면 configure-pages 가 켜 준다
# (enablement: true).
#
# 이 저장소에는 index.html 하나뿐이라 빌드할 것이 없다. 있는 파일을 그대로 올린다.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # 필요할 때 손으로 돌릴 수 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 것을 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true    # Pages 가 꺼져 있으면 켠다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .             # 저장소 전체 (index.html 이 첫 화면이 된다)
      - id: deployment
        uses: actions/deploy-pages@v4
