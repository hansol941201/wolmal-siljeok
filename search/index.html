  var UNKNOWN_YEAR = "연도 미확인";

  function esc(v) {
    return String(v === null || v === undefined ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function todayText() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  // 넘겨받은 행에서 연도별 건수를 센다. 인덱스가 붙여 둔 년도 값을 그대로 쓴다.
  function yearBreakdown(rows) {
    var counts = {};
    rows.forEach(function (r) {
      var y = (r.data && r.data["년도"]) || "";
      y = y === "" || y === null || y === undefined ? UNKNOWN_YEAR : String(y);
      counts[y] = (counts[y] || 0) + 1;
    });
    var keys = Object.keys(counts).filter(function (k) { return k !== UNKNOWN_YEAR; })
      .sort(function (a, b) { return Number(a) - Number(b); });
    if (counts[UNKNOWN_YEAR]) { keys.push(UNKNOWN_YEAR); }
    return { counts: counts, keys: keys };
  }

  function periodText(keys) {
    var nums = keys.filter(function (k) { return k !== UNKNOWN_YEAR; });
    if (!nums.length) { return UNKNOWN_YEAR; }
    return nums[0] === nums[nums.length - 1]
      ? nums[0] + "년"
      : nums[0] + "년 ~ " + nums[nums.length - 1] + "년";
  }

  // 화면에서 넘겨준 값으로 인쇄용 문서를 만들고 인쇄창을 연다.
  window.PourPdfExport = function (payload) {
    var rows = payload.rows || [];
    var columns = payload.columns || [];
    var labels = payload.labels || [];
    var criteria = payload.criteriaText || "전체";

    var yb = yearBreakdown(rows);
    var period = periodText(yb.keys);
    var total = rows.length;

    var widths = payload.widths || [];
    var wsum = widths.reduce(function (a, b) { return a + (b || 60); }, 0) || 1;
    var cols = "<colgroup>" + labels.map(function (_, i) {
      return '<col style="width:' + ((widths[i] || 60) / wsum * 100).toFixed(2) + '%">';
    }).join("") + "</colgroup>";
    var head = "<tr>" + labels.map(function (l) { return "<th>" + esc(l) + "</th>"; }).join("") + "</tr>";
    var body = rows.map(function (r) {
      return "<tr>" + columns.map(function (key, ci) {
        var v = r.original && r.original[key] !== undefined ? r.original[key] : (r.data ? r.data[key] : "");
        var cls = ci === 0 ? " class=\"num\""
          : (key === "지역" || key === "도시" || key === "세대수" ? " class=\"mid\"" : "");
        return "<td" + cls + ">" + esc(v) + "</td>";
      }).join("") + "</tr>";
    }).join("");

    var yearRows = yb.keys.map(function (k) {
      return "<tr><td class=\"mid\">" + esc(k === UNKNOWN_YEAR ? k : k + "년") + "</td>" +
             "<td class=\"mid\">" + yb.counts[k].toLocaleString() + "건</td></tr>";
    }).join("");

    var html =
      '<section class="pdf-cover">' +
        '<img class="mark" src="' + LOGO_POUR + '" alt="">' +
        '<h1>공 사 실 적 현 황</h1><div class="rule"></div>' +
        '<p class="period">' + esc(period) + '</p>' +
        '<p class="total">총 ' + total.toLocaleString() + '건</p>' +
        '<p class="scope">검색 조건 : ' + esc(criteria) + '<br>발행일 : ' + todayText() + '</p>' +
        '<div class="foot"><img src="' + LOGO_NETFORM + '" alt=""><img src="' + LOGO_POUR + '" alt=""></div>' +
      '</section>' +
      '<section class="pdf-body">' +
        '<div class="pdf-head"><b>공사실적 목록</b><span>' + esc(period) + ' · 총 ' +
          total.toLocaleString() + '건</span></div>' +
        '<table>' + cols + '<thead>' + head + '</thead><tbody>' + body + '</tbody></table>' +
      '</section>' +
      '<section class="pdf-close">' +
        '<div class="rule"></div>' +
        '<h2>위와 같이 공사실적을 제출합니다.</h2>' +
        '<div class="sum">수록 기간 &nbsp;' + esc(period) + '<br>전체 실적 &nbsp;' +
          total.toLocaleString() + '건<br>검색 조건 &nbsp;' + esc(criteria) + '</div>' +
        '<table class="yeartab"><thead><tr><th>연도</th><th>건수</th></tr></thead>' +
          '<tbody>' + yearRows + '</tbody></table>' +
        '<div class="sign">주식회사 넷폼알엔디<img src="' + SEAL + '" alt=""></div>' +
        '<div class="addr">경기도 오산시 서동로 77, 3층<br>TEL 070-7705-1311 · FAX 031-373-2734<br>' +
          todayText() + '</div>' +
        '<div class="foot"><img src="' + LOGO_NETFORM + '" alt=""><img src="' + LOGO_POUR + '" alt=""></div>' +
      '</section>';

    var box = document.getElementById("pdfDoc");
    if (!box) {
      box = document.createElement("div");
      box.id = "pdfDoc";
      document.body.appendChild(box);
    }
    box.innerHTML = html;

    var title = document.title;
    document.title = "POUR_공사실적_" + todayText();
    window.setTimeout(function () {
      window.print();
      document.title = title;
    }, 150);
  };
