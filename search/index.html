<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POUR 공사실적 검색기</title>
<style>
* { box-sizing: border-box; }

html, body {
  width: 100%; height: 100%; margin: 0; overflow: hidden;
  background: #FFFFFF; color: #17375E;
  font-family: "Malgun Gothic", "Segoe UI", sans-serif; font-size: 14px;
}

button, input, select { font: inherit; }

button {
  min-width: 104px; height: 42px; padding: 0 22px;
  border: 1px solid #17375E; border-radius: 8px;
  background: #17375E; color: #FFFFFF; cursor: pointer;
  font-weight: 700; transition: background .16s ease, border-color .16s ease, transform .08s ease, box-shadow .16s ease;
}
button:hover { background: #244D7C; box-shadow: 0 4px 12px rgba(23,55,94,.18); }
button:active { transform: translateY(1px); box-shadow: none; }
button:disabled { background: #D9D9D9; border-color: #D9D9D9; cursor: default; box-shadow: none; }
.secondary-button { background: #FFFFFF; color: #17375E; border-color: #D9D9D9; }
.secondary-button:hover { background: #F7F8FA; border-color: #17375E; }
.accent-button { background: #F58220; border-color: #F58220; }
.accent-button:hover { background: #E56F0B; border-color: #E56F0B; }

#app { height: 100%; display: flex; flex-direction: column; background: #FFFFFF; }

.app-header {
  min-height: 88px; padding: 12px 28px; display: flex; align-items: center;
  border-bottom: 1px solid #D9D9D9; background: #FFFFFF;
}
.brand-logo { width: 92px; height: 62px; object-fit: contain; }
.brand-title { flex: 1; text-align: center; }
.brand-title h1 { margin: 0; color: #17375E; font-size: 28px; line-height: 1.3; font-weight: 700; }
.brand-title p { margin: 5px 0 0; color: #17375E; font-size: 12px; opacity: .72; }
.workbook-control { width: 250px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.workbook-name { width: 230px; min-width: 0; height: 28px; padding: 0; border: 0; border-radius: 0; background: #FFFFFF; color: #17375E; font-size: 12px; font-weight: 700; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; box-shadow: none; }
.workbook-name:hover { background: #FFFFFF; color: #F58220; box-shadow: none; }
.file-change-button { min-width: 112px; height: 32px; padding: 0 12px; font-size: 12px; }
.analysis-status { margin-top: 2px; color: #F58220; font-size: 11px; font-weight: 700; }

main { min-height: 0; flex: 1; display: flex; flex-direction: column; padding: 18px 24px 0; }

.search-card {
  padding: 16px 18px; border: 1px solid #D9D9D9; border-radius: 12px;
  background: #FFFFFF; box-shadow: 0 4px 16px rgba(23,55,94,.07);
}
.search-card h2, .result-summary h2 { margin: 0; font-size: 17px; font-weight: 700; color: #17375E; }
.search-fields { display: flex; align-items: flex-end; gap: 10px; margin-top: 13px; }
.field-group { min-width: 118px; flex: 1; }
.field-group label { display: block; margin: 0 0 6px 2px; font-size: 12px; font-weight: 700; color: #17375E; }
.field-group select, .field-group input {
  width: 100%; height: 40px; padding: 0 11px; border: 1px solid #D9D9D9;
  border-radius: 7px; background: #FFFFFF; color: #17375E; outline: none;
}
.check-combo { position: relative; }
.check-combo-button { width: 100%; min-width: 0; height: 40px; padding: 0 32px 0 11px; border: 1px solid #D9D9D9; border-radius: 7px; background: #FFFFFF; color: #17375E; font-weight: 400; text-align: left; box-shadow: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check-combo-button:after { content: "\25BE"; position: absolute; right: 12px; color: #17375E; }
.check-combo-button:hover, .check-combo-button:focus { background: #FFFFFF; border-color: #F58220; box-shadow: 0 0 0 3px rgba(245,130,32,.12); }
.check-combo-panel { position: absolute; left: 0; right: 0; top: 44px; z-index: 15; display: none; max-height: 280px; overflow: auto; padding: 6px; border: 1px solid #D9D9D9; border-radius: 8px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(23,55,94,.18); }
.check-combo.open .check-combo-panel { display: block; }
.check-combo-option { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 5px 7px; border-radius: 5px; cursor: pointer; }
.check-combo-option:hover { background: #FFF4EA; }
.check-combo-option input { width: 17px; height: 17px; accent-color: #F58220; }
.field-group select:focus, .field-group input:focus { border-color: #F58220; box-shadow: 0 0 0 3px rgba(245,130,32,.12); }
.patent-field { min-width: 170px; }
.year-field { max-width: 112px; }
.keyword-field { min-width: 220px; flex: 1.5; }
.region-field { min-width: 105px; }
.household-field { min-width: 80px; max-width: 90px; flex: 0 0 84px; }
.year-separator { align-self: center; margin-top: 20px; font-weight: 700; color: #17375E; }
.search-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 14px; }

.result-summary { min-height: 48px; display: flex; align-items: center; padding: 8px 2px; }
.result-count { margin-left: 10px; color: #F58220; font-size: 19px; font-weight: 700; }
.selection-label { margin-left: 24px; font-size: 14px; font-weight: 700; }
.selection-count { margin-left: 8px; color: #F58220; font-size: 17px; font-weight: 700; }
.summary-item { margin-left: 22px; font-size: 13px; font-weight: 700; }
.search-insights { display: flex; gap: 12px; padding: 0 0 10px; }
.search-insights > div { min-width: 0; flex: 1; padding: 9px 12px; border: 1px solid #D9D9D9; border-radius: 8px; background: #FFFFFF; font-size: 12px; }
.search-insights strong { display: block; margin-bottom: 4px; color: #17375E; }
.search-insights span { color: #17375E; line-height: 1.6; }
.checkbox-column { width: 76px; text-align: center; }
.checkbox-column input { width: 17px; height: 17px; accent-color: #F58220; }
.select-all-label { display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 10px; cursor: pointer; }

.result-panel {
  min-height: 0; flex: 1; display: flex; flex-direction: column;
  border: 1px solid #D9D9D9; border-radius: 10px 10px 0 0; overflow: hidden;
}
.table-wrap { min-height: 0; flex: 1; overflow: auto; background: #FFFFFF; }
table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
th, td { height: 38px; padding: 8px 10px; border-right: 1px solid #D9D9D9; border-bottom: 1px solid #D9D9D9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
th {
  position: sticky; top: 0; z-index: 2; background: #17375E; color: #FFFFFF;
  font-weight: 700; text-align: left; cursor: pointer;
}
th:hover { background: #244D7C; }
tbody tr:nth-child(even) { background: #F7F8FA; }
tbody tr:hover { background: #FFF4EA; }
td { color: #253A50; }

.pagination {
  min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 7px 14px; background: #FFFFFF; border-top: 1px solid #D9D9D9;
}
.pagination button { min-width: 72px; height: 34px; padding: 0 14px; border-radius: 7px; }
.pagination select { height: 34px; padding: 0 8px; border: 1px solid #D9D9D9; border-radius: 6px; color: #17375E; background: #FFFFFF; }
#pageInfo { min-width: 66px; text-align: center; font-weight: 700; }

.detail-panel {
  position: fixed; top: 0; right: -540px; z-index: 20; width: 520px; height: 100%;
  display: flex; flex-direction: column; background: #FFFFFF; border-left: 1px solid #D9D9D9;
  box-shadow: -10px 0 30px rgba(23,55,94,.15); transition: right .22s ease;
}
.detail-panel.open { right: 0; }
.detail-header { padding: 20px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #D9D9D9; }
.detail-header h2 { margin: 0; font-size: 20px; }
.detail-header p { margin: 5px 0 0; font-size: 12px; }
.detail-content { min-height: 0; flex: 1; overflow: auto; padding: 8px 20px 22px; }
.detail-row { display: flex; padding: 12px 0; border-bottom: 1px solid #D9D9D9; }
.detail-label { width: 150px; flex: none; font-weight: 700; }
.detail-label small { font-weight: 400; opacity: .65; }
.detail-value { min-width: 0; flex: 1; white-space: pre-wrap; word-break: break-all; color: #253A50; }
.duplicate-banner { display: none; }

.status-bar { min-height: 30px; padding: 6px 24px; border-top: 1px solid #D9D9D9; background: #FFFFFF; color: #17375E; font-size: 12px; }
.busy-overlay { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(23,55,94,.28); }
.busy-overlay.visible { display: flex; }
.busy-card { width: 360px; padding: 30px; text-align: center; border-radius: 14px; background: #FFFFFF; border-top: 5px solid #F58220; box-shadow: 0 18px 50px rgba(23,55,94,.24); }
.busy-card h2 { margin: 0 0 10px; color: #17375E; font-size: 21px; }
.busy-card p { margin: 0; color: #17375E; }
.context-menu { position: fixed; z-index: 70; display: none; width: 140px; padding: 5px; border: 1px solid #D9D9D9; border-radius: 8px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(23,55,94,.18); }
.context-menu.visible { display: block; }
.context-menu button { width: 100%; min-width: 0; height: 34px; padding: 0 10px; border: 0; border-radius: 5px; background: #FFFFFF; color: #17375E; text-align: left; box-shadow: none; }
.context-menu button:hover { background: #17375E; color: #FFFFFF; box-shadow: none; }

@media (max-width: 1180px) {
  main { padding: 12px 14px 0; }
  .search-fields { flex-wrap: wrap; }
  .field-group { flex: 1 1 150px; }
  .year-field { max-width: none; }
  .keyword-field { flex: 2 1 280px; }
  .brand-title h1 { font-size: 24px; }
}

/* 낱개 파일·웹에서만 쓰는 것 — 파일 선택 칸은 감춘다 (버튼으로 연다) */
#workbookFileInput { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

/* 좁은 화면 대응.
   원래 프로그램은 Windows 창 전용이라 상세 패널이 520px 로 고정돼 있었다.
   화면 밖에 숨어 있어도 그 너비 때문에 본문이 가로로 넘쳤다. */
@media (max-width: 760px) {
  .detail-panel { width: 100%; right: -100%; }
  .detail-label { width: 108px; }
  .search-fields { gap: 10px 14px; }
  .app-header { flex-wrap: wrap; gap: 10px; }
}
html, body { max-width: 100%; }

/* 엑셀에서 읽은 기간. 고정 문구가 아니다. */
.period-label { margin: 2px 0 0; font-weight: 700; color: #17375E; font-size: 14px; }
</style>
<style id="pourPdfStyle">
/* ── PDF 내보내기(인쇄) 서식 ─────────────────────────────────────
   디자인은 기존 제출용 A4 포트폴리오와 같게 두고,
   내용은 업로드된 엑셀과 현재 검색·필터 결과로만 채운다. */
#pdfDoc{display:none;}
@media print{
  @page{size:A4 portrait;margin:14mm 11mm 13mm;}
  /* 화면용 레이아웃은 한 화면에 가두어 두었으므로 인쇄 때는 풀어 준다 */
  html,body{height:auto !important;overflow:visible !important;background:#fff !important;}
  body>*:not(#pdfDoc){display:none !important;}
  #pdfDoc{display:block;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#12181C;}
  #pdfDoc *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #pdfDoc .pdf-cover,#pdfDoc .pdf-body{page-break-after:always;}

  #pdfDoc .pdf-cover{height:252mm;position:relative;text-align:center;}
  #pdfDoc .pdf-cover .mark{margin-top:38mm;height:20mm;}
  #pdfDoc .pdf-cover h1{margin:16mm 0 0;font-size:30pt;letter-spacing:.06em;color:#093647;font-weight:700;}
  #pdfDoc .pdf-cover .rule{width:46mm;height:2.4mm;background:#EF7716;margin:7mm auto 0;}
  #pdfDoc .pdf-cover .period{margin-top:9mm;font-size:15pt;color:#093647;letter-spacing:.04em;}
  #pdfDoc .pdf-cover .total{margin-top:3mm;font-size:11.5pt;color:#4A5A63;}
  #pdfDoc .pdf-cover .scope{margin-top:12mm;font-size:10pt;color:#4A5A63;line-height:1.9;}
  #pdfDoc .pdf-cover .foot{position:absolute;left:0;right:0;bottom:0;}
  #pdfDoc .pdf-cover .foot img{height:11mm;margin:0 7mm;vertical-align:middle;}

  #pdfDoc .pdf-head{border-bottom:.7mm solid #093647;padding-bottom:2mm;margin-bottom:4mm;overflow:hidden;}
  #pdfDoc .pdf-head b{font-size:12pt;color:#093647;float:left;}
  #pdfDoc .pdf-head span{float:right;font-size:8.5pt;color:#5A6970;padding-top:2mm;}

  #pdfDoc table{width:100%;border-collapse:collapse;font-size:7.6pt;table-layout:fixed;}
  #pdfDoc thead{display:table-header-group;}
  #pdfDoc thead th{background:#093647;color:#fff;font-weight:600;padding:2mm 1.4mm;
                   border:.2mm solid #093647;text-align:center;letter-spacing:.02em;}
  #pdfDoc tbody td{padding:1.7mm 1.4mm;border:.2mm solid #C9D3D8;vertical-align:top;}
  /* 화면 표에는 한 줄 말줄임이 걸려 있다. 인쇄에서는 전부 보여야 하므로 푼다 */
  #pdfDoc td,#pdfDoc th{white-space:normal !important;text-overflow:clip !important;
                        overflow:visible !important;max-width:none !important;
                        word-break:break-word;line-height:1.45;}
  #pdfDoc tbody tr:nth-child(even) td{background:#F2F5F7;}
  #pdfDoc tbody tr{page-break-inside:avoid;}
  #pdfDoc td.num{text-align:center;color:#5A6970;}
  #pdfDoc td.mid{text-align:center;}

  #pdfDoc .pdf-close{padding-top:26mm;position:relative;height:252mm;}
  #pdfDoc .pdf-close .rule{width:46mm;height:2.4mm;background:#EF7716;margin:0 0 12mm;}
  #pdfDoc .pdf-close h2{font-size:16pt;color:#093647;margin:0 0 10mm;letter-spacing:.04em;}
  #pdfDoc .pdf-close .sum{font-size:10.5pt;color:#2A3A42;line-height:2.1;}
  #pdfDoc .pdf-close .yeartab{margin:10mm 0 0;width:110mm;font-size:9pt;}
  #pdfDoc .pdf-close .sign{margin-top:20mm;font-size:13pt;color:#093647;font-weight:700;
                           display:inline-block;position:relative;padding-right:24mm;}
  #pdfDoc .pdf-close .sign img{position:absolute;right:0;top:-7mm;height:20mm;opacity:.92;}
  #pdfDoc .pdf-close .addr{margin-top:6mm;font-size:9pt;color:#5A6970;line-height:1.8;}
  #pdfDoc .pdf-close .foot{position:absolute;left:0;right:0;bottom:0;text-align:center;}
  #pdfDoc .pdf-close .foot img{height:10mm;margin:0 7mm;vertical-align:middle;}
}
</style>
</head>

        <button id="selectWorkbookButton" class="secondary-button file-change-button" type="button">Excel 파일 선택</button>

    <main>
      <section class="search-card" aria-label="검색 조건">
        <h2>검색조건</h2>
        <div class="search-fields">
          <div class="field-group"><label for="workTypeButton">공종</label><div id="workTypeCombo" class="check-combo"><button id="workTypeButton" class="check-combo-button" type="button">전체</button><div id="workTypePanel" class="check-combo-panel"></div></div></div>
          <div class="field-group patent-field"><label for="patentFilter">특허번호</label><select id="patentFilter"><option value="">전체</option></select></div>
          <div class="field-group region-field"><label for="provinceFilter">지역</label><select id="provinceFilter"><option value="">전체</option></select></div>
          <div class="field-group region-field"><label for="cityFilter">도시</label><select id="cityFilter"><option value="">전체</option></select></div>
          <div class="field-group household-field"><label for="householdInput">세대수</label><input id="householdInput" type="text" inputmode="numeric" maxlength="7" autocomplete="off" placeholder="최소" /></div>
          <div class="field-group year-field"><label for="startYearFilter">시작년도</label><select id="startYearFilter"><option value="">전체</option></select></div>
          <span class="year-separator">~</span>
          <div class="field-group year-field"><label for="endYearFilter">종료년도</label><select id="endYearFilter"><option value="">전체</option></select></div>
        </div>
        <div class="search-actions">
          <button id="searchButton" type="button">검색</button>
          <button id="clearButton" class="secondary-button" type="button">초기화</button>
          <button id="exportXlsxButton" class="accent-button" type="button">엑셀 내보내기</button><button id="exportCsvButton" class="secondary-button" type="button">CSV</button><button id="exportPdfButton" class="secondary-button" type="button">PDF 내보내기</button>
        </div>
      </section>

      <section class="result-summary" aria-label="검색 결과 요약">
        <h2>검색결과</h2>
        <span id="resultCount" class="result-count">0건</span>
        <span class="selection-label">선택</span>
        <span id="selectionCount" class="selection-count">0건</span>
        <span id="searchElapsed" class="summary-item">검색 시간 0.00초</span>
        <span id="householdTotal" class="summary-item">총 세대수 0세대</span>
      </section>

      <section id="searchInsights" class="search-insights">
        <div><strong>검색 조건</strong><span id="criteriaSummary">전체</span></div>
        <div><strong>연도별 건수</strong><span id="yearSummary">-</span></div>
        <div><strong>공종별 건수</strong><span id="workTypeSummary">-</span></div>
      </section>

      <section class="result-panel">
        <div class="table-wrap">
          <table id="resultTable">
            <thead id="resultHead"></thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button id="previousPage" class="secondary-button" type="button">이전</button>
          <span id="pageInfo">1 / 1</span>
          <button id="nextPage" class="secondary-button" type="button">다음</button>
          <label for="pageSize">페이지당</label>
          <select id="pageSize">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="250">250</option>
          </select>
        </div>
      </section>
    </main>

    <aside id="detailPanel" class="detail-panel" aria-hidden="true">
      <div class="detail-header">
        <div>
          <h2>상세 정보</h2>
          <p id="detailSource"></p>
        </div>
        <button id="closeDetailButton" class="secondary-button" type="button">닫기</button>
      </div>
      <div id="duplicateBanner" class="duplicate-banner"></div>
      <div id="detailContent" class="detail-content"></div>
    </aside>

    <div id="statusBar" class="status-bar">준비</div>
    <div id="selectionMenu" class="context-menu">
      <button type="button" data-action="all">전체 선택</button>
      <button type="button" data-action="none">전체 해제</button>
      <button type="button" data-action="invert">선택 반전</button>

  function headerKey(value, config) {
    var original = text(value).trim();
    if (!original) return "";
    var compact = original.replace(/\s+/g, "");
    var aliases = config.columnAliases || {};
    for (var name in aliases) {
      if (Object.prototype.hasOwnProperty.call(aliases, name) &&
          name.replace(/\s+/g, "") === compact) {
        return String(aliases[name]);
      }
    }
    return compact;
  }

  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  /** 값 통합 (슁글 → 싱글 처럼). 메모리에서만 바꾸고 원본은 따로 남긴다. */
  function memoryValue(column, value, config) {
    if (value === null || value === undefined) return null;
    var t = text(value).trim();
    if (!t) return null;
    var byColumn = (config.valueAliases || {})[column];
    if (byColumn) {
      for (var from in byColumn) {
        if (Object.prototype.hasOwnProperty.call(byColumn, from)) {
          t = t.replace(new RegExp(escapeRegExp(from), "g"), String(byColumn[from]));
        }
      }
    }
    return t;
  }

  /* ------------------------------------------------------- 연도 읽기 */

  var UNKNOWN_YEAR = "연도 미확인";

  /**
   * 어떤 모양으로 적혀 있든 네 자리 연도로 맞춘다.
   *
   *   2018 · "2018" · "2018년" · "2018년도"      → 2018
   *   "'18년" · "18년" · "18"                    → 2018
   *   엑셀 날짜값(45000 같은 일련번호)            → 그 날짜의 연도
   *   Date · "2018-03-01" · "2018/3/1"           → 2018
   *
   * 알 수 없으면 빈 값을 준다. 임의로 아무 해에 넣지 않는다.
   */
  function normalizeYear(value) {
    if (value === null || value === undefined || value === "") return "";

    if (value instanceof Date && !isNaN(value)) return String(value.getFullYear());

    var t = text(value).trim();
    if (!t) return "";

    // 네 자리 연도가 그대로 보이는 경우 (1900~2099)
    var four = /(?:^|\D)((?:19|20)\d{2})(?:\D|$)/.exec(t);
    if (four) return four[1];

    // 엑셀 날짜 일련번호. 1900-01-01 이 1 이다.
    // 20000(1954년)~80000(2119년) 범위만 날짜로 본다. 세대수 같은 숫자와 섞이지 않게.
    if (/^\d+(\.\d+)?$/.test(t)) {
      var n = Number(t);
      if (n >= 20000 && n <= 80000) {
        var ms = (n - 25569) * 86400 * 1000;      // 1970-01-01 기준으로 옮김
        var d = new Date(ms);
        if (!isNaN(d)) return String(d.getUTCFullYear());
      }
      // 날짜 일련번호가 아니면 아래 두 자리 연도 판정으로 넘어간다 ("18" → 2018)
    }

    // 두 자리 연도 — "18년", "'18", "18"
    var two = /^\s*['\u2019]?(\d{2})\s*년?(?:도)?\s*$/.exec(t);
    if (two) {
      var y = Number(two[1]);
      return String(y <= 79 ? 2000 + y : 1900 + y);
    }
    return "";
  }

  /** 그 행에서 연도를 알아낸다. 년도 열 → 날짜가 든 열 → (밖에서) 시트 이름 순. */
  function yearFromRow(data) {
    var direct = normalizeYear(data["년도"]);
    if (direct) return direct;

    // 날짜로 보이는 열에서 찾는다 (공고일·개찰일·준공일 …)
    for (var key in data) {
      if (!Object.prototype.hasOwnProperty.call(data, key)) continue;
      if (!/일자?$|날짜|date/i.test(key)) continue;
      var fromDate = normalizeYear(data[key]);
      if (fromDate) return fromDate;
    }
    return "";
  }

  function keyText(v) {
    if (v === null || v === undefined) return "";
    return text(v).replace(/\s+/g, "").trim().toLowerCase();
  }

  /* ------------------------------------------------------- 행정구역 */

  function regionIndex(regions) {
    var provinceByTerm = {};
    var districtByTerm = {};
    var aliases = regions.aliases || {};

    (regions.provinces || []).forEach(function (province) {
      var code = String(province.code);
      provinceByTerm[keyText(province.name)] = code;
      for (var aliasName in aliases) {
        if (Object.prototype.hasOwnProperty.call(aliases, aliasName) &&
            String(aliases[aliasName]) === String(province.name)) {
          provinceByTerm[keyText(aliasName)] = code;
        }
      }
      (province.districts || []).forEach(function (district) {
        var terms = [String(district.name)];
        String(district.name).split(/\s+/).forEach(function (part) {
          if (!part) return;
          terms.push(part);
          var last = part.charAt(part.length - 1);
          if (part.length > 2 && (last === "시" || last === "군" || last === "구")) {
            terms.push(part.substring(0, part.length - 1));
          }
        });
        terms.forEach(function (term) {
          var key = keyText(term);
          if (!key) return;
          if (!districtByTerm[key]) districtByTerm[key] = {};
          districtByTerm[key][code] = true;
        });
      });
    });

    return { provinceByTerm: provinceByTerm, districtByTerm: districtByTerm };
  }

  /**
   * 한 행이 어느 시도에 속하는지.
   * 시도가 적혀 있으면 그것이 우선이다. 시군구 이름만 있을 때는 딱 하나로
   * 정해지는 경우에만 쓴다 (중구처럼 여러 곳에 있는 이름은 그냥 둔다).
   */
  function rowProvinceCodes(data, index) {
    var explicit = {}, candidates = [];
    ["지역", "도시"].forEach(function (field) {
      var value = data[field];
      if (!value) return;
      var key = keyText(value);
      if (index.provinceByTerm[key]) explicit[index.provinceByTerm[key]] = true;
      if (index.districtByTerm[key]) candidates.push(index.districtByTerm[key]);
    });

    var codes = Object.keys(explicit);
    if (codes.length) return codes;

    var found = {};
    candidates.forEach(function (set) {
      var keys = Object.keys(set);
      if (keys.length === 1) found[keys[0]] = true;
    });
    return Object.keys(found);
  }

  /* ------------------------------------------------------- 중복 판정 */

  function markDuplicates(records, rules) {
    (rules || []).slice().sort(function (a, b) { return a.level - b.level; }).forEach(function (rule) {
      var groups = {};
      records.forEach(function (record) {
        if (record.duplicateLevel !== 0) return;
        var parts = [];
        for (var i = 0; i < rule.fields.length; i++) {
          var value = keyText(record.data[rule.fields[i]]);
          if (!value) return;                       // 비어 있으면 판정하지 않는다
          parts.push(value);
        }
        var key = parts.join("|");
        (groups[key] = groups[key] || []).push(record);
      });

      var sequence = 0;
      Object.keys(groups).forEach(function (key) {
        var group = groups[key];
        if (group.length < 2) return;
        sequence++;
        var groupId = "DUP-L" + rule.level + "-" + ("00000" + sequence).slice(-5);
        group.forEach(function (record) {
          record.duplicateLevel = rule.level;
          record.duplicateStatus = rule.status;
          record.duplicateGroupIds = [groupId];
        });
      });
    });
  }

  /* ------------------------------------------------------- 시트 읽기 */

  var EXTRA_HEADERS = ["순번", "현장주소", "발주처(아파트명)", "공사범위", "세대수", "공사품질"];

  /**
   * 시트 한 장을 읽는다.
   * @param name  시트 이름
   * @param rows  [[셀,셀,...], ...] 1행부터. 빈 칸은 null.
   */
  function readSheet(name, rows, config, index, records) {
    var scanRows = Number(config.workbook.headerScanRows) || 40;
    var minimum = Number(config.workbook.minimumRecognizedHeaders) || 2;
    var searchFields = config.searchFields || [];

    var headerRowNumber = null, recognized = null;
    for (var r = 0; r < Math.min(rows.length, scanRows); r++) {
      var candidate = {}, count = 0, values = [];
      var row = rows[r] || [];
      for (var c = 0; c < row.length; c++) {
        var key = headerKey(row[c], config);
        if (!key) continue;
        if (searchFields.indexOf(key) >= 0 || EXTRA_HEADERS.indexOf(key) >= 0) {
          candidate[c + 1] = key; count++; values.push(key);
        }
      }
      if (count >= minimum &&
          (values.indexOf("공사명") >= 0 || values.indexOf("지역") >= 0 || values.indexOf("공종") >= 0)) {
        headerRowNumber = r + 1;
        recognized = values;
        break;
      }
    }
    if (headerRowNumber === null) {
      return { ignored: { name: name, reason: "No valid data header" } };
    }

    var maxColumn = 0;
    rows.forEach(function (row) { if (row && row.length > maxColumn) maxColumn = row.length; });

    var headerRow = rows[headerRowNumber - 1] || [];
    var definitions = [], usedKeys = {};
    for (var col = 1; col <= maxColumn; col++) {
      var raw = headerRow[col - 1];
      var originalHeader = text(raw).trim();
      var key = headerKey(raw, config);
      if (!key) { key = "열 " + excelColumnName(col); originalHeader = key; }
      if (usedKeys[key]) { usedKeys[key]++; key = key + " (" + usedKeys[key] + ")"; }
      else { usedKeys[key] = 1; }
      definitions.push({ column: col, key: key, originalHeader: originalHeader,
                         sourceColumn: excelColumnName(col) });
    }

    var sheetRecordCount = 0;
    for (var i = headerRowNumber; i < rows.length; i++) {
      var source = rows[i] || [];
      var data = {}, original = {}, nonEmpty = 0;
      definitions.forEach(function (definition) {
        var value = source[definition.column - 1];
        if (value !== null && value !== undefined && text(value).trim()) nonEmpty++;
        original[definition.key] = (value === null || value === undefined) ? null : text(value);
        data[definition.key] = memoryValue(definition.key, value, config);
      });
      if (nonEmpty < 2) continue;

      // 시트 중간에 제목줄이 다시 나오면 자료로 세지 않는다
      var isHeaderRepeat = false;
      for (var k = 0; k < recognized.length; k++) {
        var field = recognized[k];
        if (data[field] !== undefined && headerKey(data[field], config) === field) {
          isHeaderRepeat = true; break;
        }
      }
      if (isHeaderRepeat) continue;

      var searchParts = [];
      searchFields.forEach(function (field) {
        if (data[field]) searchParts.push(text(data[field]));
      });

      records.push({
        id: name + ":" + (i + 1),
        sheetName: name,
        sourceRow: i + 1,
        data: data,
        original: original,
        provinceCodes: rowProvinceCodes(data, index),
        searchText: searchParts.join(" ").replace(/\s+/g, " ").trim().toLowerCase(),
        duplicateStatus: "",
        duplicateLevel: 0,
        duplicateGroupIds: []
      });
      sheetRecordCount++;
    }

    if (sheetRecordCount === 0) {
      return { ignored: { name: name, reason: "Title/header only" } };
    }
    return {
      sheet: {
        name: name,
        headerRow: headerRowNumber,
        recordCount: sheetRecordCount,
        columns: definitions.map(function (d) {
          return { key: d.key, originalHeader: d.originalHeader, sourceColumn: d.sourceColumn };
        })
      }
    };
  }

  /* ------------------------------------------------------- 인덱스 만들기 */

  function unique(list) {
    var seen = {}, out = [];
    list.forEach(function (v) { if (v && !seen[v]) { seen[v] = true; out.push(v); } });
    return out.sort();
  }

  /**
   * @param sheets [{ name, rows }]  rows 는 [[셀,...], ...]
   * @returns 검색 인덱스 (HTA 가 쓰던 것과 같은 모양)
   */
  function build(sheets, config, regions, workbookInfo) {
    var index = regionIndex(regions);
    var records = [], loaded = [], ignored = [];

    sheets.forEach(function (sheet) {
      var result = readSheet(sheet.name, sheet.rows, config, index, records);
      if (result.ignored) ignored.push(result.ignored);
      else loaded.push(result.sheet);
    });

    // 연도를 정한다. 우선순위는 년도 열 → 날짜가 든 열 → 시트 이름.
    //
    // 시트 이름은 단일 연도와 맞을 때만 쓴다. 범위·요약 시트
    // ("22년도~25년도 전체실적", "옥상방수21~25년")는 어느 해인지 알 수 없으므로
    // 추측하지 않는다. 끝의 "(2)" 는 엑셀이 시트를 복사할 때 붙이는 표시라 무시한다.
    //
    // 끝까지 알 수 없으면 "연도 미확인" 으로 따로 둔다. 아무 해에 넣지 않는다.
    records.forEach(function (record) {
      var year = yearFromRow(record.data);
      if (!year) {
        var match = /^\s*((?:19|20)\d{2}|\d{2})\s*년?\s*(?:\(\d+\))?\s*$/.exec(record.sheetName);
        if (match) year = normalizeYear(match[1]);
      }
      record.year = year || UNKNOWN_YEAR;
      if (!year) return;
      record.data["년도"] = year;
      if (!new RegExp("(?:^|\\D)" + year + "(?:\\D|$)").test(record.searchText)) {
        record.searchText = (record.searchText + " " + year).trim();
      }
    });

    markDuplicates(records, config.duplicateRules);

    // 엑셀에 실제로 있는 연도를 전부 모은다. 목록을 미리 정해 두지 않는다.
    var yearSet = {}, unknownCount = 0;
    records.forEach(function (r) {
      if (r.year === UNKNOWN_YEAR) { unknownCount++; return; }
      yearSet[r.year] = (yearSet[r.year] || 0) + 1;
    });
    var years = Object.keys(yearSet).map(Number).sort(function (a, b) { return a - b; });
    var yearCounts = {};
    years.forEach(function (y) { yearCounts[y] = yearSet[String(y)]; });
    if (unknownCount) yearCounts[UNKNOWN_YEAR] = unknownCount;

    var workTypes = [];
    records.forEach(function (r) {
      text(r.data["공종"]).split(/[,;/\r\n]+/).forEach(function (part) {
        var v = part.trim(); if (v) workTypes.push(v);
      });
    });

    var regionValues = records.map(function (r) { return text(r.data["지역"]).trim(); });

    var patentNumbers = [];
    records.forEach(function (r) {
      var matches = text(r.data["특허번호"]).match(/\d{7}/g) || [];
      matches.forEach(function (m) { patentNumbers.push("10-" + m); });
    });

    var allHeaders = [];
    loaded.forEach(function (s) { s.columns.forEach(function (c) { allHeaders.push(c.key); }); });

    var expectedColumns = unique((config.searchFields || [])
      .concat((config.resultColumns || []).map(function (c) { return c.key; })));

    var sheetMetadata = loaded.map(function (sheet) {
      var keys = sheet.columns.map(function (c) { return c.key; });
      var byHeader = {};
      sheet.columns.forEach(function (c) { byHeader[c.originalHeader] = (byHeader[c.originalHeader] || 0) + 1; });
      var duplicateColumns = Object.keys(byHeader)
        .filter(function (h) { return byHeader[h] > 1; })
        .map(function (h) { return { header: h, count: byHeader[h] }; });
      return {
        name: sheet.name, headerRow: sheet.headerRow, recordCount: sheet.recordCount,
        headers: sheet.columns.map(function (c) { return c.originalHeader; }),
        usedColumns: keys, columnStructure: sheet.columns, duplicateColumns: duplicateColumns,
        missingColumns: expectedColumns.filter(function (k) { return keys.indexOf(k) < 0; })
      };
    });

    var allSheetNames = loaded.map(function (s) { return s.name; })
      .concat(ignored.map(function (s) { return s.name; }));

    var metadata = {
      verified: loaded.length > 0 && records.length > 0,
      totalSheetCount: allSheetNames.length,
      dataSheetCount: loaded.length,
      emptySheetCount: ignored.length,
      totalRecordCount: records.length,
      allSheets: allSheetNames,
      dataSheets: loaded.map(function (s) { return s.name; }),
      emptySheets: ignored,
      years: years,
      // 화면 제목과 통계가 쓰는 값. 모두 엑셀에서 센 것이다.
      yearCounts: yearCounts,
      minYear: years.length ? years[0] : null,
      maxYear: years.length ? years[years.length - 1] : null,
      unknownYearCount: unknownCount,
      workTypes: unique(workTypes),
      regions: unique(regionValues),
      patentNumbers: unique(patentNumbers),
      headers: unique(allHeaders),
      expectedColumns: expectedColumns,
      sheets: sheetMetadata
    };

    if (!metadata.verified) {
      throw new Error("검색 가능한 데이터 시트가 없습니다. 다른 엑셀 파일을 선택해 주세요.");
    }

    var confirmed = 0, possible = 0;
    records.forEach(function (r) {
      if (r.duplicateLevel === 1) confirmed++;
      else if (r.duplicateLevel === 2 || r.duplicateLevel === 3) possible++;
    });

    return {
      schemaVersion: 2,
      generatedAt: new Date().toISOString(),
      workbook: workbookInfo || { name: "", path: "", lastWriteTime: "" },
      summary: {
        sheetCount: loaded.length,
        ignoredSheetCount: ignored.length,
        recordCount: records.length,
        confirmedDuplicateCount: confirmed,
        possibleDuplicateCount: possible
      },
      sheets: loaded,
      ignoredSheets: ignored,
      metadata: metadata,
      records: records
    };
  }

  return { build: build, headerKey: headerKey, keyText: keyText, regionIndex: regionIndex };
});
</script>
<script>/* ─────────────────────────────────────────────────────────────
   브라우저용 바꿔치기

   원래 프로그램은 Windows 전용 기능 세 가지를 썼다.
     ADODB.Stream      파일 읽기·쓰기
     WScript.Shell     PowerShell 실행 (엑셀 읽기 · 내보내기)
     HTA:APPLICATION   창 만들기

   브라우저에는 이런 것이 없다. 그래서 같은 일을 하는 것으로 바꾼다.
     엑셀 읽기   파일 선택 창 + SheetJS (컴퓨터 안에서만 처리한다)
     인덱스 생성 PourIndex.build (PowerShell 로직을 그대로 옮긴 것)
     내보내기    브라우저 내려받기 (엑셀 · CSV)

   화면과 검색·필터·정렬 코드는 원래 것을 그대로 쓴다.
   자료는 어디로도 전송되지 않는다. 인터넷 없이 동작한다.
   ───────────────────────────────────────────────────────────── */

/** 원래 readUtf8Json 이 하던 일. 이제 파일 대신 심어 둔 값을 준다. */
function readUtf8Json(path) {
  if (/config\.json$/i.test(path)) return POUR_CONFIG;
  if (/regions\.json$/i.test(path)) return POUR_REGIONS;
  if (/search-index\.json$/i.test(path)) {
    if (!POUR_STATE.index) {
      throw new Error("엑셀 파일을 아직 선택하지 않았습니다.");
    }
    return POUR_STATE.index;
  }
  throw new Error("읽을 수 없는 경로입니다: " + path);
}

/** 원래는 진단 파일을 남겼다. 브라우저에서는 남길 곳이 없어 아무 것도 하지 않는다. */
function writeUtf8Json() { }

function joinPath(left, right) { return String(right); }
function getProjectRoot() { return ""; }

var POUR_STATE = { index: null, file: null, rows: null };

/** 고른 엑셀을 읽어 검색 인덱스를 만든다. 원래 Build-SearchIndex.ps1 이 하던 일. */
function buildIndexFromFile(file, done) {
  var reader = new FileReader();
  reader.onerror = function () { done(new Error("파일을 읽지 못했습니다.")); };
  reader.onload = function (event) {
    try {
      var workbook = XLSX.read(new Uint8Array(event.target.result), {
        type: "array", cellDates: false, raw: false
      });
      var sheets = workbook.SheetNames.map(function (name) {
        return {
          name: name,
          rows: XLSX.utils.sheet_to_json(workbook.Sheets[name], {
            header: 1, raw: false, defval: null, blankrows: true
          })
        };
      });
      var index = PourIndex.build(sheets, POUR_CONFIG, POUR_REGIONS, {
        name: file.name,
        path: file.name,
        lastWriteTime: file.lastModified ? new Date(file.lastModified).toISOString() : ""
      });
      POUR_STATE.index = index;
      POUR_STATE.file = file;
      done(null, index);
    } catch (error) {
      done(error);
    }
  };
  reader.readAsArrayBuffer(file);
}

/* 파일을 고르면 할 일. 화면이 뜰 때 한 번만 붙인다.
   버튼을 눌러야 붙는 구조였다면, 파일을 끌어다 놓거나 다른 길로 들어올 때
   아무 일도 일어나지 않는다. */
/**
 * 새 엑셀을 올리면 앞의 자료와 화면 집계를 모두 지운다.
 *
 * 이것이 없으면 앞 파일에서 고른 조건(연도·지역·공종)이 그대로 남아,
 * 새 파일에 없는 연도로 걸러져 결과가 거의 안 나온다.
 * (17,069건짜리 파일이 4건으로 보이는 일이 실제로 있었다)
 */
function resetSearchState() {
  try { window.localStorage.removeItem("pourSearchCriteria"); } catch (e) {}
  POUR_STATE.index = null;
  ["patentFilter", "provinceFilter", "cityFilter",
   "startYearFilter", "endYearFilter"].forEach(function (id) {
    var el = document.getElementById(id);
    if (el) { el.value = ""; el.options.length = 1; }     // "전체" 만 남긴다
  });
  var households = document.getElementById("householdInput");
  if (households) households.value = "";
  var panel = document.getElementById("workTypePanel");
  if (panel) panel.innerHTML = "";
  var body = document.getElementById("resultBody");
  if (body) body.innerHTML = "";
  var count = document.getElementById("resultCount");
  if (count) count.innerText = "0건";
}

function handleWorkbookChosen(file) {
  if (!file) return;
  resetSearchState();
  setBusy(true, "엑셀 파일 분석 중...", "모든 시트를 읽어 검색 자료를 만들고 있습니다.");
  document.getElementById("analysisStatus").innerText = "Excel 분석중...";
  window.setTimeout(function () {
    buildIndexFromFile(file, function (error) {
      setBusy(false);
      if (error) {
        document.getElementById("analysisStatus").innerText = "분석 실패";
        setStatus("분석 오류: " + error.message);
        alert("엑셀 파일을 읽지 못했습니다.\n\n" + error.message);
        return;
      }
      // 화면 갱신까지 여기서 끝낸다. 어느 길로 파일이 들어오든 같게 동작한다.
      try {
        loadData();
        setStatus("준비");
      } catch (loadError) {
        document.getElementById("analysisStatus").innerText = "분석 실패";
        setStatus("불러오기 오류: " + loadError.message);
        alert("검색 자료를 만들지 못했습니다.\n\n" + loadError.message);
      }
    });
  }, 50);
}

function bindWorkbookInput() {
  var input = document.getElementById("workbookFileInput");
  input.addEventListener("change", function () {
    handleWorkbookChosen(input.files && input.files[0]);
  });
}

/** 파일 선택 창을 띄운다. */
function pickWorkbook() {
  var input = document.getElementById("workbookFileInput");
  input.value = "";
  input.click();
}

/** 파일을 내려받게 한다. */
function downloadBlob(blob, fileName) {
  if (window.navigator && window.navigator.msSaveOrOpenBlob) {
    window.navigator.msSaveOrOpenBlob(blob, fileName);
    return;
  }
  var url = URL.createObjectURL(blob);
  var link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function timestampText() {
  var d = new Date();
  function two(n) { return (n < 10 ? "0" : "") + n; }
  return d.getFullYear() + two(d.getMonth() + 1) + two(d.getDate()) + "_" +
         two(d.getHours()) + two(d.getMinutes()) + two(d.getSeconds());
}
</script>
<script>

  "use strict";

  var state = {
    root: "",
    config: null,
    regions: null,
    index: null,
    records: [],
    filtered: [],
    selected: {},
    sortKey: "공사명",
    sortDirection: 1,
    page: 1,
    pageSize: 100,
    searchTimer: null
  };

  function getSelectedWorkTypes() {
    var panel = byId("workTypePanel");
    var inputs = panel ? panel.getElementsByTagName("input") : [];
    var values = [];
    var i;
    for (i = 0; i < inputs.length; i++) {
      if (inputs[i].checked) { values.push(inputs[i].value); }
    }
    return values;
  }

  function getWorkTypeSummary(values) {
    values = values || getSelectedWorkTypes();
    if (!values.length) { return "전체"; }
    if (values.length === 1) { return values[0]; }
    if (values.length === 2) { return values[0] + ", " + values[1]; }
    return values[0] + " 외 " + (values.length - 1) + "개";
  }

  function updateWorkTypeSummary() {
    byId("workTypeButton").innerText = getWorkTypeSummary();
  }

  function setSelectedWorkTypes(values) {
    var selected = {};
    var i;
    values = values || [];
    for (i = 0; i < values.length; i++) { selected[String(values[i])] = true; }
    var inputs = byId("workTypePanel").getElementsByTagName("input");
    for (i = 0; i < inputs.length; i++) { inputs[i].checked = !!selected[inputs[i].value]; }
    updateWorkTypeSummary();
  }

  function byId(id) {
    return document.getElementById(id);
  }

  function escapeHtml(value) {
    return String(value === null || typeof value === "undefined" ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function normalizeText(value) {
    return String(value || "").replace(/\s+/g, "").toLowerCase();
  }

  var PROVINCE_OPTIONS = [
    ["서울", "11"], ["경기", "41"], ["인천", "28"], ["강원", "51"],
    ["충북", "43"], ["충남", "44"], ["세종", "36"], ["대전", "30"],
    ["광주", "12G"], ["전북", "52"], ["전남", "12J"], ["경북", "47"],
    ["경남", "48"], ["부산", "26"], ["울산", "31"], ["대구", "27"], ["제주", "50"]
  ];

  function getProvinceByCode(code) {
    code = String(code || "").replace(/[GJ]$/, "");
    var provinces = state.regions.provinces || [];
    var i;
    for (i = 0; i < provinces.length; i++) {
      if (String(provinces[i].code) === String(code)) { return provinces[i]; }
    }
    return null;
  }

  function populateProvinceFilter() {
    var select = byId("provinceFilter");
    select.options.length = 1;
    var i;
    for (i = 0; i < PROVINCE_OPTIONS.length; i++) {
      if (!getProvinceByCode(PROVINCE_OPTIONS[i][1])) { continue; }
      var option = document.createElement("option");
      option.text = PROVINCE_OPTIONS[i][0];
      option.value = PROVINCE_OPTIONS[i][1];
      select.add(option);
    }
  }

  function populateCityFilter(selectedValue) {
    var select = byId("cityFilter");
    select.options.length = 1;
    var province = getProvinceByCode(byId("provinceFilter").value);
    if (!province) { select.disabled = true; return; }
    select.disabled = false;
    var seen = {};
    var districts = province.districts || [];
    var i;
    for (i = 0; i < districts.length; i++) {
      var official = String(districts[i].name || "");
      if (byId("provinceFilter").value === "12G" && String(districts[i].code).indexOf("122") !== 0) { continue; }
      if (byId("provinceFilter").value === "12J" && String(districts[i].code).indexOf("122") === 0) { continue; }
      if (!official || official.indexOf(" ") >= 0) { continue; }
      var display = official.replace(/[시군구]$/, "");
      if (seen[display]) { continue; }
      seen[display] = true;
      var option = document.createElement("option");
      option.text = display;
      option.value = official;
      select.add(option);
    }
    select.value = selectedValue || "";
  }

  function recordMatchesLocation(record, provinceCode, cityName) {
    if (!provinceCode) { return true; }
    var provinceVariant = /[GJ]$/.test(provinceCode) ? provinceCode.slice(-1) : "";
    provinceCode = String(provinceCode).replace(/[GJ]$/, "");
    var codes = record.provinceCodes || [];
    var codeMatches = false;
    var i;
    for (i = 0; i < codes.length; i++) {
      if (String(codes[i]) === String(provinceCode)) { codeMatches = true; break; }
    }
    if (!codeMatches) { return false; }
    if (provinceVariant) {
      var rawRegion = normalizeText((record.data || {})["지역"]);
      if (provinceVariant === "G" && rawRegion.indexOf("광주") < 0) { return false; }
      if (provinceVariant === "J" && rawRegion.indexOf("전남") < 0 && rawRegion.indexOf("전라남") < 0) { return false; }
    }
    if (!cityName) { return true; }
    var recordCity = record._searchCache ? record._searchCache.city : normalizeText(record.data["도시"]);
    var full = normalizeText(cityName);
    var shortName = normalizeText(String(cityName).replace(/[시군구]$/, ""));
    return recordCity === full || recordCity === shortName ||
      recordCity.indexOf(full) === 0 || recordCity.indexOf(shortName) === 0;
  }

  function getMinimumHouseholds() {
    return Math.max(0, Number(byId("householdInput").value || 0));
  }

  function prepareRecordCaches() {
    var i;
    for (i = 0; i < state.records.length; i++) {
      var data = state.records[i].data || {};
      state.records[i]._searchCache = {
        year: getRecordYear(state.records[i]),
        workType: normalizeText(data["공종"]),
        patent: normalizeText(data["특허번호"]),
        city: normalizeText(data["도시"]),
        households: numericValue(data["세대수"])
      };
    }
  }

  function setStatus(message) {
    byId("statusBar").innerText = message;
  }

  function setBusy(visible, title, message) {
    byId("busyTitle").innerText = title || "처리 중";
    byId("busyMessage").innerText = message || "잠시만 기다려 주십시오.";
    byId("busyOverlay").className = visible ? "busy-overlay visible" : "busy-overlay";
  }

  function getProvinceCode(query) {
    var key = normalizeText(query);
    var official = query;
    var alias;
    for (alias in state.regions.aliases) {
      if (state.regions.aliases.hasOwnProperty(alias) && normalizeText(alias) === key) {
        official = state.regions.aliases[alias];
        break;
      }
    }
    var i;
    for (i = 0; i < state.regions.provinces.length; i++) {
      if (normalizeText(state.regions.provinces[i].name) === normalizeText(official)) {
        return state.regions.provinces[i].code;
      }
    }
    return "";
  }

  function recordMatches(record, query, field) {
    if (!query) {
      return true;
    }
    var normalizedQuery = normalizeText(query);
    var provinceCode = getProvinceCode(query);
    if ((field === "all" || field === "지역" || field === "도시") && provinceCode) {
      var codes = record.provinceCodes || [];
      var i;
      for (i = 0; i < codes.length; i++) {
        if (String(codes[i]) === String(provinceCode)) {
          return true;
        }
      }
      if (field !== "all") {
        return false;
      }
    }

    if (field === "all") {
      return normalizeText(record.searchText).indexOf(normalizedQuery) >= 0;
    }
    return normalizeText(record.data[field]).indexOf(normalizedQuery) >= 0;
  }

  function resolveOfficialRegion(query) {
    if (!query) { return { type: "all" }; }
    var provinceCode = getProvinceCode(query);
    if (provinceCode) { return { type: "province", code: String(provinceCode) }; }
    var normalizedQuery = normalizeText(query);
    var candidates = [];
    var p;
    for (p = 0; p < state.regions.provinces.length; p++) {
      var province = state.regions.provinces[p];
      var d;
      for (d = 0; d < province.districts.length; d++) {
        var officialName = String(province.districts[d].name || "");
        var parts = officialName.split(/\s+/);
        var terms = [];
        var matched = false;
        var i;
        if (normalizeText(officialName) === normalizedQuery) {
          terms.push(officialName);
          matched = true;
        }
        for (i = 0; i < parts.length; i++) {
          var shortName = parts[i].replace(/[시군구]$/, "");
          if (normalizeText(parts[i]) === normalizedQuery ||
              normalizeText(shortName) === normalizedQuery) {
            terms.push(parts[i]);
            if (shortName) { terms.push(shortName); }
            matched = true;
          }
        }
        if (matched) {
          candidates.push({ provinceCode: String(province.code), terms: terms });
        }
      }
    }
    return { type: candidates.length ? "district" : "invalid", candidates: candidates };
  }

  function recordMatchesOfficialRegion(record, matcher) {
    if (matcher.type === "all") { return true; }
    var codes = record.provinceCodes || [];
    var i;
    if (matcher.type === "province") {
      for (i = 0; i < codes.length; i++) {
        if (String(codes[i]) === matcher.code) { return true; }
      }
      return false;
    }
    if (matcher.type !== "district") { return false; }
    var city = normalizeText(record.data["도시"]);
    for (i = 0; i < matcher.candidates.length; i++) {
      var candidate = matcher.candidates[i];
      var codeMatches = false;
      var c;
      for (c = 0; c < codes.length; c++) {
        if (String(codes[c]) === candidate.provinceCode) { codeMatches = true; break; }
      }
      if (!codeMatches) { continue; }
      var t;
      for (t = 0; t < candidate.terms.length; t++) {
        if (city === normalizeText(candidate.terms[t])) { return true; }
      }
    }
    return false;
  }

  function applyFilters() {
    var startedAt = new Date().getTime();
    var workTypeQueries = getSelectedWorkTypes();
    var normalizedWorkTypes = [];
    var workTypeNormalizeIndex;
    for (workTypeNormalizeIndex = 0; workTypeNormalizeIndex < workTypeQueries.length; workTypeNormalizeIndex++) {
      normalizedWorkTypes.push(normalizeText(workTypeQueries[workTypeNormalizeIndex]));
    }
    var provinceCode = byId("provinceFilter").value;
    var cityName = byId("cityFilter").value;
    var minimumHouseholds = getMinimumHouseholds();
    var patentQuery = byId("patentFilter").value;
    var startYear = Number(byId("startYearFilter").value || 0);
    var endYear = Number(byId("endYearFilter").value || 0);
    var output = [];
    var i;

    if (startYear && endYear && startYear > endYear) {
      state.filtered = [];
      state.selected = {};
      state.page = 1;
      renderResults();
      setStatus("시작년도는 종료년도보다 클 수 없습니다.");
      alert("시작년도가 종료년도보다 큽니다. 기간을 다시 선택하십시오.");
      return;
    }

    for (i = 0; i < state.records.length; i++) {
      var record = state.records[i];
      var recordYear = record._searchCache.year;
      if (startYear && (!recordYear || recordYear < startYear)) { continue; }
      if (endYear && (!recordYear || recordYear > endYear)) { continue; }
      var workTypeMatches = workTypeQueries.length === 0;
      var workTypeIndex;
      for (workTypeIndex = 0; !workTypeMatches && workTypeIndex < normalizedWorkTypes.length; workTypeIndex++) {
        workTypeMatches = record._searchCache.workType.indexOf(normalizedWorkTypes[workTypeIndex]) >= 0;
      }
      if (workTypeMatches &&
          recordMatchesLocation(record, provinceCode, cityName) &&
          recordMatches(record, patentQuery, "특허번호") &&
          record._searchCache.households >= minimumHouseholds) {
        output.push(record);
      }
    }

    state.filtered = output;
    state.selected = {};
    for (i = 0; i < output.length; i++) { state.selected[output[i].id] = true; }
    state.page = 1;
    sortResults();
    renderResults();
    renderSearchInsights((new Date().getTime() - startedAt) / 1000);
    setStatus(output.length.toLocaleString() + "건을 검색했습니다.");
    saveSearchCriteria();
  }

  function numericValue(value) {
    var match = String(value || "").replace(/,/g, "").match(/-?\d+(?:\.\d+)?/);
    return match ? Number(match[0]) : 0;
  }

  function summarizeCounts(field, yearMode) {
    var counts = {};
    var i;
    for (i = 0; i < state.filtered.length; i++) {
      var key = yearMode ? getRecordYear(state.filtered[i]) : String(state.filtered[i].data[field] || "").replace(/^\s+|\s+$/g, "");
      if (key) { counts[key] = (counts[key] || 0) + 1; }
    }
    var keys = [];
    var key;
    for (key in counts) { if (counts.hasOwnProperty(key)) { keys.push(key); } }
    keys.sort(function (a, b) { return yearMode ? Number(a) - Number(b) : a.localeCompare(b); });
    var parts = [];
    for (i = 0; i < keys.length; i++) { parts.push(keys[i] + " : " + counts[keys[i]].toLocaleString() + "건"); }
    parts.push("합계 : " + state.filtered.length.toLocaleString() + "건");
    return parts.join(" · ");
  }

  function renderSearchInsights(elapsedSeconds) {
    var criteria = getSelectedCriteria();
    var totalHouseholds = 0;
    var i;
    for (i = 0; i < state.filtered.length; i++) { totalHouseholds += numericValue(state.filtered[i].data["세대수"]); }
    byId("searchElapsed").innerText = "검색 시간 " + Number(elapsedSeconds || 0).toFixed(2) + "초";
    byId("householdTotal").innerText = "총 세대수 " + totalHouseholds.toLocaleString() + "세대";
    byId("criteriaSummary").innerText = "공종 " + criteria.workType + " · 지역 " + (criteria.region || "전체") +
      " · 도시 " + (criteria.district || "전체") + " · 세대수 " +
      (criteria.minimumHouseholds ? Number(criteria.minimumHouseholds).toLocaleString() + "세대 이상" : "전체") +
      " · 특허번호 " + (criteria.patentNumber ? "10-" + criteria.patentNumber : "전체") +
      " · 기간 " + (criteria.startYear || "전체") + " ~ " + (criteria.endYear || "전체");
    byId("yearSummary").innerText = summarizeCounts("년도", true);
    byId("workTypeSummary").innerText = summarizeCounts("공종", false);
  }

  function getRecordYear(record) {
    var value = record && record.data ? record.data["년도"] : "";
    var match = String(value || "").match(/(?:19|20)\d{2}/);
    return match ? Number(match[0]) : 0;
  }

  function getPatentNumbers(value) {
    var matches = String(value || "").match(/\d{7}/g) || [];
    var unique = {};
    var output = [];
    var i;
    for (i = 0; i < matches.length; i++) {
      if (!unique[matches[i]]) {
        unique[matches[i]] = true;
        output.push(matches[i]);
      }
    }
    return output;
  }

  function formatPatentDisplay(value) {
    var numbers = getPatentNumbers(value);
    if (!numbers.length) { return String(value || ""); }
    var output = [];
    var i;
    for (i = 0; i < numbers.length; i++) { output.push("10-" + numbers[i]); }
    return output.join(", ");
  }

  function compareValues(a, b) {
    var left = String(a === null || typeof a === "undefined" ? "" : a).toLowerCase();
    var right = String(b === null || typeof b === "undefined" ? "" : b).toLowerCase();
    return left.localeCompare(right);
  }

  function sortResults() {
    state.filtered.sort(function (a, b) {
      var left = state.sortKey === "_duplicate" ? a.duplicateLevel : a.data[state.sortKey];
      var right = state.sortKey === "_duplicate" ? b.duplicateLevel : b.data[state.sortKey];
      return compareValues(left, right) * state.sortDirection;
    });
  }

  function duplicateLabel(record) {
    if (record.duplicateLevel === 1) {
      return '<span class="duplicate-confirmed">Confirmed Duplicate</span>';
    }
    if (record.duplicateLevel === 2 || record.duplicateLevel === 3) {
      return '<span class="duplicate-possible">Possible Duplicate</span>';
    }
    return "";
  }

  function renderHeader() {
    var html = '<tr><th class="checkbox-column no-sort"><label class="select-all-label"><input id="selectAllResults" type="checkbox" title="검색 결과 전체 선택" /><span>전체선택</span></label></th>';
    var visibleColumns = getVisibleResultColumns();
    var i;
    for (i = 0; i < visibleColumns.length; i++) {
      var column = visibleColumns[i];
      html += '<th data-key="' + escapeHtml(column.key) + '" style="width:' +
        Number(column.width || 120) + 'px">' + escapeHtml(column.label) + "</th>";
    }
    html += "</tr>";
    byId("resultHead").innerHTML = html;

    var headers = byId("resultHead").getElementsByTagName("th");
    for (i = 0; i < headers.length; i++) {
      if (headers[i].getAttribute("data-key")) {
        headers[i].onclick = function () {
          var key = this.getAttribute("data-key");
          if (state.sortKey === key) {
            state.sortDirection *= -1;
          } else {
            state.sortKey = key;
            state.sortDirection = 1;
          }
          sortResults();
          renderResults();
        };
      }
    }
    byId("selectAllResults").onclick = toggleAllResultsSelection;
  }

  function renderResults() {
    var totalPages = Math.max(1, Math.ceil(state.filtered.length / state.pageSize));
    if (state.page > totalPages) {
      state.page = totalPages;
    }
    var start = (state.page - 1) * state.pageSize;
    var end = Math.min(start + state.pageSize, state.filtered.length);
    var html = "";
    var visibleColumns = getVisibleResultColumns();
    var i;
    for (i = start; i < end; i++) {
      var record = state.filtered[i];
      html += '<tr data-id="' + escapeHtml(record.id) + '">';
      html += '<td class="checkbox-column"><input class="row-select" type="checkbox" data-id="' +
        escapeHtml(record.id) + '"' + (state.selected[record.id] ? " checked" : "") + " /></td>";
      var c;
      for (c = 0; c < visibleColumns.length; c++) {
        var key = visibleColumns[c].key;
        var displayValue = key === "특허번호" ?
          formatPatentDisplay(record.data[key]) : record.data[key];
        html += "<td title=\"" + escapeHtml(displayValue) + "\">" +
          escapeHtml(displayValue) + "</td>";
      }
      html += "</tr>";
    }
    if (!html) {
      html = '<tr><td colspan="' + (visibleColumns.length + 1) +
        '" style="padding:32px;text-align:center">검색 결과가 없습니다.</td></tr>';
    }
    byId("resultBody").innerHTML = html;

    var rows = byId("resultBody").getElementsByTagName("tr");
    for (i = 0; i < rows.length; i++) {
      if (rows[i].getAttribute("data-id")) {
        rows[i].ondblclick = function () {
          openDetail(this.getAttribute("data-id"));
        };
      }
    }
    var checks = byId("resultBody").getElementsByTagName("input");
    for (i = 0; i < checks.length; i++) {
      if (checks[i].className === "row-select") {
        checks[i].onclick = function (event) {
          event = event || window.event;
          if (event.stopPropagation) { event.stopPropagation(); }
          setSelected(this.getAttribute("data-id"), this.checked);
        };
      }
    }
    byId("resultCount").innerText = state.filtered.length.toLocaleString() + "건";
    byId("pageInfo").innerText = state.page + " / " + totalPages;
    byId("previousPage").disabled = state.page <= 1;
    byId("nextPage").disabled = state.page >= totalPages;
    updateSelectionCount();
  }

  function getVisibleResultColumns() {
    var columns = [];
    var i;
    for (i = 0; i < state.config.resultColumns.length; i++) {
      var column = state.config.resultColumns[i];
      if (column.key !== "원본시트" && column.key !== "중복시트" &&
          column.label !== "원본시트" && column.label !== "중복시트") {
        columns.push(column);
      }
    }
    return columns;
  }

  function findRecord(id) {
    var i;
    for (i = 0; i < state.records.length; i++) {
      if (state.records[i].id === id) {
        return state.records[i];
      }
    }
    return null;
  }

  function getRecordColumns(record) {
    if (record.columns && record.columns.length) {
      return record.columns;
    }
    var i;
    for (i = 0; i < state.index.sheets.length; i++) {
      if (state.index.sheets[i].name === record.sheetName) {
        return state.index.sheets[i].columns || [];
      }
    }
    return [];
  }

  function setSelected(id, selected) {
    if (selected) {
      state.selected[id] = true;
    } else {
      delete state.selected[id];
    }
    renderResults();
  }

  function togglePageSelection() {
    var start = (state.page - 1) * state.pageSize;
    var end = Math.min(start + state.pageSize, state.filtered.length);
    var checked = byId("selectPage").checked;
    var i;
    for (i = start; i < end; i++) {
      if (checked) {
        state.selected[state.filtered[i].id] = true;
      } else {
        delete state.selected[state.filtered[i].id];
      }
    }
    renderResults();
  }

  function toggleAllResultsSelection() {
    setFilteredSelection(byId("selectAllResults").checked ? "all" : "none");
  }

  function setFilteredSelection(action) {
    var i;
    for (i = 0; i < state.filtered.length; i++) {
      var id = state.filtered[i].id;
      if (action === "all") { state.selected[id] = true; }
      else if (action === "none") { delete state.selected[id]; }
      else if (action === "invert") {
        if (state.selected[id]) { delete state.selected[id]; }
        else { state.selected[id] = true; }
      }
    }
    renderResults();
  }

  function updateSelectionCount() {
    var count = 0;
    var i;
    for (i = 0; i < state.filtered.length; i++) {
      if (state.selected[state.filtered[i].id]) { count++; }
    }
    byId("selectionCount").innerText = count.toLocaleString() + "건";
    var canExport = state.filtered.length > 0;
    byId("exportXlsxButton").disabled = !canExport;
    byId("exportCsvButton").disabled = !canExport;
    byId("exportPdfButton").disabled = !canExport;
    var selectAll = byId("selectAllResults");
    if (selectAll) { selectAll.checked = state.filtered.length > 0 && count === state.filtered.length; }
  }

  function openDetail(id) {
    var record = findRecord(id);
    if (!record) { return; }
    byId("detailSource").innerText = record.sheetName + " / 행 " + record.sourceRow;
    var banner = byId("duplicateBanner");
    if (record.duplicateStatus) {
      banner.className = "duplicate-banner visible";
      banner.innerText = record.duplicateStatus + " · Level " + record.duplicateLevel;
    } else {
      banner.className = "duplicate-banner";
      banner.innerText = "";
    }

    var html = "";
    var i;
    var columns = getRecordColumns(record);
    for (i = 0; i < columns.length; i++) {
      var column = columns[i];
      var label = column.originalHeader || column.key;
      html += '<div class="detail-row"><div class="detail-label">' +
        escapeHtml(label) + '<br><small>열 ' + escapeHtml(column.sourceColumn) +
        '</small></div><div class="detail-value">' +
        escapeHtml(record.original[column.key]) + "</div></div>";
    }
    byId("detailContent").innerHTML = html;
    byId("detailPanel").className = "detail-panel open";
    byId("detailPanel").setAttribute("aria-hidden", "false");
  }

  function closeDetail() {
    byId("detailPanel").className = "detail-panel";
    byId("detailPanel").setAttribute("aria-hidden", "true");
  }

  // runPowerShell 은 브라우저에 없다. 부르던 자리를 아래에서 바꿔 끼웠다.

  function abbreviateFileName(name) {
    name = String(name || "");
    if (name.length <= 28) { return name; }
    var dot = name.lastIndexOf(".");
    var extension = dot >= 0 ? name.substring(dot) : "";
    var stem = dot >= 0 ? name.substring(0, dot) : name;
    return stem.substring(0, 12) + "..." + stem.substring(stem.length - 8) + extension;
  }

  function updateWorkbookDisplay() {
    var button = byId("currentWorkbookButton");
    var name = state.index && state.index.workbook ? state.index.workbook.name : "파일 미선택";
    button.innerText = abbreviateFileName(name);
    button.title = name;
    byId("selectWorkbookButton").innerText = name === "파일 미선택" ?
      "Excel 파일 선택" : "파일 변경";
  }

  function formatProcessError(response) {
    response = response || {};
    var detail = response.buildError || response;
    var lines = [];
    lines.push(detail.message || response.message || "알 수 없는 오류");
    if (detail.exceptionType) { lines.push("Exception: " + detail.exceptionType); }
    if (detail.failedFile || response.failedFile) { lines.push("실패 파일: " + (detail.failedFile || response.failedFile)); }
    if (detail.failedFunction) { lines.push("실패 함수: " + detail.failedFunction); }
    if (detail.failedScript) { lines.push("실패 스크립트: " + detail.failedScript); }
    if (detail.failedLine) { lines.push("실패 위치: " + detail.failedLine + "행" + (detail.failedColumn ? " " + detail.failedColumn + "열" : "")); }
    if (detail.scriptStackTrace) { lines.push("ScriptStackTrace:\n" + detail.scriptStackTrace); }
    if (detail.stackTrace) { lines.push("StackTrace:\n" + detail.stackTrace); }
    if (detail.exception) { lines.push("Exception detail:\n" + detail.exception); }
    return lines.join("\n");
  }

  function selectWorkbook() { pickWorkbook(); }

  function getSelectedRecords() {
    var rows = [];
    var i;
    for (i = 0; i < state.records.length; i++) {
      if (state.selected[state.records[i].id]) {
        rows.push(state.records[i]);
      }
    }
    return rows.length ? rows : state.filtered.slice(0);
  }

  // 현재 검색·필터 결과 그대로 A4 PDF 서식으로 인쇄한다.
  // 기간·건수·연도별 집계는 아래 rows 에서만 계산한다 (고정값 없음).
  function exportPdf() {
    var rows = getSelectedRecords();
    if (!rows.length) {
      alert("내보낼 검색 결과가 없습니다.");
      return;
    }
    setBusy(true, "PDF 서식 만드는 중...", rows.length + "건을 담고 있습니다.");
    window.setTimeout(function () {
      try {
        window.PourPdfExport({
          rows: rows,
          columns: state.config.resultColumns.map(function (c) { return c.key; }),
          labels: state.config.resultColumns.map(function (c) { return c.label; }),
          widths: state.config.resultColumns.map(function (c) { return c.width || 60; }),
          criteriaText: describeCriteria(getSelectedCriteria())
        });
        setStatus("PDF 내보내기 · " + rows.length + "건");
      } catch (error) {
        setStatus("PDF 내보내기 오류: " + error.message);
        alert("PDF 를 만드는 중 오류가 생겼습니다.\n\n" + error.message);
      } finally {
        setBusy(false);
      }
    }, 50);
  }

  // 표지·마지막 장에 적을 검색 조건 문장. 고른 값만 이어 붙인다.
  function describeCriteria(c) {
    var parts = [];
    if (c.workType && c.workType !== "전체") { parts.push("공종 " + c.workType); }
    if (c.region) { parts.push(c.region + (c.district ? " " + c.district : "")); }
    if (c.patentNumber) { parts.push("특허 " + c.patentNumber); }
    if (c.startYear || c.endYear) {
      parts.push("연도 " + (c.startYear || "처음") + " ~ " + (c.endYear || "끝"));
    }
    if (c.minimumHouseholds) { parts.push("세대수 " + c.minimumHouseholds + " 이상"); }
    return parts.length ? parts.join(" · ") : "전체";
  }

  function exportSelected(format) {
    var rows = getSelectedRecords();
    if (!rows.length) {
      alert("내보낼 검색 결과가 없습니다.");
      return;
    }
    var isCsv = format === "CSV";
    var formatName = isCsv ? "CSV" : "Excel";
    setBusy(true, formatName + " 만드는 중...", rows.length + "건을 담고 있습니다.");
    window.setTimeout(function () {
      try {
        // 화면에 보이는 열 그대로 담는다. 원본 값(original)을 쓴다.
        var columns = state.config.resultColumns.map(function (c) { return c.key; });
        var header = state.config.resultColumns.map(function (c) { return c.label; });
        var table = [header];
        rows.forEach(function (record) {
          table.push(columns.map(function (key) {
            var value = record.original && record.original[key] !== undefined
              ? record.original[key] : record.data[key];
            return value === null || value === undefined ? "" : String(value);
          }));
        });

        var prefix = (state.config.export && state.config.export.filePrefix) || "POUR_공사실적";
        var fileName = prefix + "_" + timestampText();

        if (isCsv) {
          var csv = table.map(function (line) {
            return line.map(function (cell) {
              return '"' + String(cell).replace(/"/g, '""') + '"';
            }).join(",");
          }).join("\r\n");
          // 엑셀이 한글을 바로 알아보도록 BOM 을 앞에 붙인다
          downloadBlob(new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" }),
                       fileName + ".csv");
        } else {
          var sheetName = (state.config.export && state.config.export.worksheetName) || "검색결과";
          var book = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(book, XLSX.utils.aoa_to_sheet(table), sheetName);
          var output = XLSX.write(book, { bookType: "xlsx", type: "array" });
          downloadBlob(new Blob([output], { type: "application/octet-stream" }),
                       fileName + ".xlsx");
        }
        setStatus(formatName + " 내려받기 완료 · " + rows.length + "건");
      } catch (error) {
        setStatus("내보내기 오류: " + error.message);
        alert("내보내기 중 오류가 생겼습니다.\n\n" + error.message);
      } finally {
        setBusy(false);
      }
    }, 50);
  }

  function getSelectedCriteria() {
    var workTypes = getSelectedWorkTypes();
    var province = byId("provinceFilter");
    var city = byId("cityFilter");
    return {
      workType: workTypes.length ? getWorkTypeSummary(workTypes) : "전체",
      workTypes: workTypes,
      region: province.selectedIndex > 0 ? province.options[province.selectedIndex].text : "",
      regionCode: province.value,
      district: city.selectedIndex > 0 ? city.options[city.selectedIndex].text : "",
      districtOfficial: city.value,
      minimumHouseholds: getMinimumHouseholds(),
      patentNumber: byId("patentFilter").value,
      startYear: byId("startYearFilter").value,
      endYear: byId("endYearFilter").value,
      nameCompany: ""
    };
  }

  function refreshIndex() {
    if (!POUR_STATE.file) { selectWorkbook(); return; }
    setBusy(true, "엑셀 다시 읽기", "모든 시트를 읽어 검색 자료를 갱신하고 있습니다.");
    window.setTimeout(function () {
      buildIndexFromFile(POUR_STATE.file, function (error) {
        setBusy(false);
        if (error) {
          setStatus("다시 읽기 오류: " + error.message);
          alert("엑셀을 다시 읽지 못했습니다.\n\n" + error.message);
          return;
        }
        try { loadData(); setStatus("갱신 완료"); }
        catch (loadError) { setStatus("불러오기 오류: " + loadError.message); }
      });
    }, 50);
  }

  function populateFilters() {
    populateWorkTypeFilter();
    populatePatentFilter();
    populateProvinceFilter();
    populateCityFilter("");
    populateMetadataSelect("startYearFilter", state.index.metadata.years, false);
    populateMetadataSelect("endYearFilter", state.index.metadata.years, false);
    if (state.index.metadata.unknownYearCount) {
      ["startYearFilter", "endYearFilter"].forEach(function (id) {
        var option = document.createElement("option");
        option.value = "연도 미확인";
        option.text = "연도 미확인 (" + state.index.metadata.unknownYearCount.toLocaleString() + "건)";
        byId(id).add(option);
      });
    }
  }

  function populateWorkTypeFilter() {
    var panel = byId("workTypePanel");
    panel.innerHTML = "";
    var values = state.index.metadata.workTypes || [];
    var i;
    for (i = 0; i < values.length; i++) {
      var label = document.createElement("label");
      label.className = "check-combo-option";
      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = values[i];
      checkbox.onclick = updateWorkTypeSummary;
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(values[i]));
      panel.appendChild(label);
    }
    updateWorkTypeSummary();
  }

  function populatePatentFilter() {
    var keys = state.index.metadata.patentNumbers || [];
    var select = byId("patentFilter");
    var i;
    for (i = 0; i < keys.length; i++) {
      var option = document.createElement("option");
      option.value = String(keys[i]).replace(/^10-/, "");
      option.text = /^10-/.test(keys[i]) ? keys[i] : "10-" + keys[i];
      select.add(option);
    }
  }

  function saveSearchCriteria() {
    try { window.localStorage.setItem("pourSearchCriteria", JSON.stringify(getSelectedCriteria())); }
    catch (error) { }
  }

  function restoreSearchCriteria() {
    try {
      var saved = JSON.parse(window.localStorage.getItem("pourSearchCriteria") || "null");
      if (!saved) { return; }
      setSelectedWorkTypes(saved.workTypes || (saved.workType && saved.workType !== "전체" ? [saved.workType] : []));
      byId("patentFilter").value = saved.patentNumber || "";
      byId("provinceFilter").value = saved.regionCode || "";
      populateCityFilter(saved.districtOfficial || "");
      byId("householdInput").value = saved.minimumHouseholds || "";
      byId("startYearFilter").value = saved.startYear || "";
      byId("endYearFilter").value = saved.endYear || "";
    } catch (error) { }
  }

  function populateMetadataSelect(elementId, keys, patentDisplay) {
    var select = byId(elementId);
    var i;
    keys = keys || [];
    for (i = 0; i < keys.length; i++) {
      var option = document.createElement("option");
      option.value = keys[i];
      option.text = patentDisplay ? formatPatentDisplay(keys[i]) : keys[i];
      select.add(option);
    }
  }

  function getSelectOptionTexts(elementId) {
    var options = byId(elementId).options;
    var values = [];
    var i;
    for (i = 0; i < options.length; i++) { values.push(options[i].text); }
    return values;
  }

  function loadData() {
    state.config = POUR_CONFIG;
    state.regions = POUR_REGIONS;
    state.index = POUR_STATE.index;
    if (!state.index.metadata || !state.index.metadata.verified) {
      throw new Error("Excel 메타데이터가 없거나 검증되지 않았습니다. Excel 파일을 다시 선택하십시오.");
    }
    state.records = state.index.records || [];
    prepareRecordCaches();
    state.filtered = [];
    state.selected = {};
    byId("searchButton").disabled = true;
    byId("exportXlsxButton").disabled = true;
    if (byId("exportCsvButton")) byId("exportCsvButton").disabled = true;
    if (byId("exportPdfButton")) byId("exportPdfButton").disabled = true;
    byId("patentFilter").options.length = 1;
    byId("startYearFilter").options.length = 1;
    byId("endYearFilter").options.length = 1;
    populateFilters();
    restoreSearchCriteria();
    renderHeader();
    sortResults();
    renderResults();
    updateWorkbookDisplay();
    var meta0 = state.index.metadata;
    var span = meta0.minYear && meta0.maxYear
      ? (meta0.minYear === meta0.maxYear ? meta0.minYear + "년"
         : meta0.minYear + "년 ~ " + meta0.maxYear + "년")
      : "연도 미확인";
    byId("periodLabel").innerText = span + (meta0.unknownYearCount
      ? " · 연도 미확인 " + meta0.unknownYearCount.toLocaleString() + "건" : "");
    byId("workbookInfo").innerText = state.index.workbook.name + " · " +
      state.index.metadata.totalSheetCount + "개 시트 (데이터 " + state.index.metadata.dataSheetCount + ") · " +
      Number(state.index.summary.recordCount).toLocaleString() + "건 · " +
      new Date(state.index.generatedAt).toLocaleString();
    var metadata = state.index.metadata;
    var firstYear = metadata.years.length ? metadata.years[0] : "-";
    var lastYear = metadata.years.length ? metadata.years[metadata.years.length - 1] : "-";
    byId("analysisStatus").innerText = "분석 완료 · 총 시트 " + metadata.totalSheetCount + " · 데이터 시트 " +
      metadata.dataSheetCount + " · " + Number(metadata.totalRecordCount).toLocaleString() + "건 · 공종 " +
      metadata.workTypes.length + " · 지역 " + metadata.regions.length + " · 특허 " + metadata.patentNumbers.length +
      " · 연도 " + firstYear + "~" + lastYear;
    byId("searchButton").disabled = false;
    renderSearchInsights(0);
  }

  function bindEvents() {
    byId("searchButton").onclick = runSearch;
    byId("selectWorkbookButton").onclick = selectWorkbook;
    byId("currentWorkbookButton").onclick = selectWorkbook;
    byId("workTypeButton").onclick = function (event) {
      event = event || window.event;
      if (event.stopPropagation) { event.stopPropagation(); }
      event.cancelBubble = true;
      var combo = byId("workTypeCombo");
      combo.className = combo.className.indexOf(" open") >= 0 ? "check-combo" : "check-combo open";
    };
    byId("clearButton").onclick = function () {
      setSelectedWorkTypes([]);
      byId("provinceFilter").value = "";
      populateCityFilter("");
      byId("householdInput").value = "";
      byId("patentFilter").value = "";
      byId("startYearFilter").value = "";
      byId("endYearFilter").value = "";
      applyFilters();
      byId("workTypeButton").focus();
    };
    byId("previousPage").onclick = function () {
      if (state.page > 1) { state.page--; renderResults(); }
    };
    byId("nextPage").onclick = function () {
      var total = Math.ceil(state.filtered.length / state.pageSize);
      if (state.page < total) { state.page++; renderResults(); }
    };
    byId("pageSize").onchange = function () {
      state.pageSize = Number(this.value);
      state.page = 1;
      renderResults();
    };
    byId("closeDetailButton").onclick = closeDetail;
    byId("exportXlsxButton").onclick = function () { exportSelected("XLSX"); };
    byId("exportCsvButton").onclick = function () { exportSelected("CSV"); };
    byId("exportPdfButton").onclick = exportPdf;
    byId("provinceFilter").onchange = function () { populateCityFilter(""); };
    byId("householdInput").oninput = function () {
      this.value = this.value.replace(/[^0-9]/g, "").replace(/^0+(?=\d)/, "");
    };
    byId("householdInput").onkeydown = function (event) {
      event = event || window.event;
      var code = event.keyCode;
      var allowed = (code >= 48 && code <= 57) || (code >= 96 && code <= 105) ||
        code === 8 || code === 9 || code === 13 || code === 37 || code === 39 || code === 46;
      if (!allowed) { event.returnValue = false; if (event.preventDefault) { event.preventDefault(); } }
    };
    byId("resultTable").oncontextmenu = function (event) {
      event = event || window.event;
      if (event.preventDefault) { event.preventDefault(); }
      event.returnValue = false;
      var menu = byId("selectionMenu");
      menu.style.left = event.clientX + "px";
      menu.style.top = event.clientY + "px";
      menu.className = "context-menu visible";
      return false;
    };
    var menuButtons = byId("selectionMenu").getElementsByTagName("button");
    var menuIndex;
    for (menuIndex = 0; menuIndex < menuButtons.length; menuIndex++) {
      menuButtons[menuIndex].onclick = function () {
        setFilteredSelection(this.getAttribute("data-action"));
        byId("selectionMenu").className = "context-menu";
      };
    }
    document.onkeydown = function (event) {
      event = event || window.event;
      if (event.keyCode === 27) { closeDetail(); }
      if (event.keyCode === 13) { runSearch(); }
    };
    document.onclick = function () {
      byId("selectionMenu").className = "context-menu";
      byId("workTypeCombo").className = "check-combo";
    };
  }

  function runSearch() {
    setBusy(true, "검색 중...", "검색 조건을 적용하고 있습니다.");
    window.setTimeout(function () {
      try { applyFilters(); }
      finally { setBusy(false); }
    }, 30);
  }

  function initialize() {
    state.root = "";
    state.config = POUR_CONFIG;
    state.regions = POUR_REGIONS;
    bindEvents();
    bindWorkbookInput();
    byId("searchButton").disabled = true;
    byId("exportXlsxButton").disabled = true;
    if (byId("exportCsvButton")) byId("exportCsvButton").disabled = true;
    if (byId("exportPdfButton")) byId("exportPdfButton").disabled = true;
    byId("analysisStatus").innerText = "Excel 대기";
    byId("workbookInfo").innerText =
      "오른쪽 위 [Excel 파일 선택] 을 눌러 공사실적 엑셀을 여세요.";
    setStatus("엑셀 파일을 선택해 주세요.");
  }

  
window.onload = initialize;
</script>
<div id="pdfDoc"></div>
<script>
/* PDF 내보내기 ─ 브라우저 인쇄로 A4 PDF 를 만든다.
   기간·전체 건수·연도별 건수·표의 모든 행은 업로드된 엑셀과
